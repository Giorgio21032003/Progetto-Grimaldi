<mat-toolbar color="primary" class="toolbar-logo">
   <div class="logo-container">
      <img src="assets/img/Bandiera Bianca.png" alt="Logo GGroup" />
   </div>
   <span class="spacer"></span>

   <!-- Avatar utente -->
   <div class="user-avatar" matButton [matMenuTriggerFor]="aboveMenu">
      {{ userInitials }}
   </div>

   <mat-menu #aboveMenu="matMenu" class="user-menu" yPosition="below" xPosition="before">
      <div class="menu-content p-2">
         <!-- Campo nome utente disabilitato -->
         <mat-form-field appearance="outline" class="menu-input">
            <label class="fw-bold">Utente:</label>
            <input matInput disabled [value]="userName" class="fw-bold"/>
         </mat-form-field>

         <!-- Pulsante Logout -->
         <button mat-flat-button color="warn" class="menu-logout" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Log Out</span>
         </button>
      </div>
   </mat-menu>
</mat-toolbar>
